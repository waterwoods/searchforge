# Example Secret manifest - DO NOT commit real secrets!
# Replace the values below with your actual API keys before applying.
#
# To create the secret manually (recommended):
#   kubectl create secret generic ecommerce-agent-secrets \
#     --from-literal=OPENAI_API_KEY=sk-your-key-here \
#     --from-literal=LANGSMITH_API_KEY=lsv2_pt_your-key-here
#
# Or apply this file after replacing REPLACE_ME values:
#   kubectl apply -f secret-example.yaml

apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-agent-secrets
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME"
  # Optional: LangSmith API key for observability
  LANGSMITH_API_KEY: "REPLACE_ME"

