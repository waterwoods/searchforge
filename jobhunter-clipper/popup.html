<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobHunter Clipper</title>
  <style>
    body {
      width: 500px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 14px;
      margin: 0;
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: #333;
    }

    .url-display {
      margin-bottom: 12px;
      padding: 8px;
      background: #f5f5f5;
      border-radius: 4px;
      word-break: break-all;
      font-size: 12px;
      color: #666;
    }

    #jd-preview {
      width: 100%;
      min-height: 200px;
      max-height: 300px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      font-family: monospace;
      resize: vertical;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    .info {
      margin-bottom: 12px;
      font-size: 13px;
      color: #666;
    }

    #clip-btn {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }

    #clip-btn:hover {
      background: #0056b3;
    }

    #clip-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      min-height: 20px;
    }

    #status.success {
      background: #d4edda;
      color: #155724;
    }

    #status.error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>

<body>
  <h1>JobHunter Clipper</h1>

  <div class="url-display" id="url">Loading URL...</div>

  <textarea id="jd-preview" readonly placeholder="Loading job description preview..."></textarea>

  <div class="info">
    <span id="saved-count">Saved clips: 0</span>
  </div>

  <button id="clip-btn">Save clip</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>

</html>
